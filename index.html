<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>gliderRecord - 个人技术知识库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="个人工作记录和知识库">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="keywords" content="技术文档,知识库,工作记录">
  
  <!-- Docsify 主题 - 默认使用 Simple 主题 -->
  <link rel="stylesheet" id="docsify-theme" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <!-- Font Awesome 图标库 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
  
  <!-- PDF.js 样式 -->
  <style>
    .pdf-viewer-container {
      width: 100%;
      height: 800px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin: 20px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    
    .pdf-viewer-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  
  <style>
    :root {
      /* Lapis 主题配色 */
      --lapis-primary: #4870ac;
      --lapis-text: #40464f;
      --lapis-bg: #ffffff;
      --lapis-block-bg: #f6f8fa;
      --lapis-marker: #a2b6d4;
      --lapis-border: #e3e8f0;

      /* Docsify 兼容 */
      --theme-color: var(--lapis-primary);
      --theme-color-dark: #3a5a8a;
      --gradient-primary: linear-gradient(135deg, #4870ac 0%, #5b8bc4 100%);
      --gradient-secondary: linear-gradient(135deg, #614f9c 0%, #7d6ab8 100%);
      --gradient-success: linear-gradient(135deg, #428485 0%, #5aa5a6 100%);
    }

    /* 全局动画 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -1000px 0;
      }
      100% {
        background-position: 1000px 0;
      }
    }

    /* 页面加载动画 */
    body {
      animation: fadeInUp 0.6s ease-out;
    }

    /* 侧边栏样式增强 */
    .sidebar {
      padding-top: 10px;
      border-right: 1px solid #eee;
      background: linear-gradient(180deg, #fafafa 0%, #ffffff 100%);
    }

    .sidebar-nav > ul > li > a {
      font-weight: 600;
      margin: 0;
      padding: 8px 0;
      transition: all 0.3s ease;
    }

    .sidebar-nav > ul > li > a:hover {
      transform: translateX(5px);
      color: var(--theme-color);
    }

    /* 侧边栏链接图标 */
    .sidebar-nav ul li a {
      position: relative;
    }

    .sidebar-nav ul li a::before {
      content: '▸';
      position: absolute;
      left: -15px;
      opacity: 0;
      transition: all 0.3s ease;
      color: var(--theme-color);
    }

    .sidebar-nav ul li a:hover::before {
      opacity: 1;
      left: -18px;
    }
    
    /* 主题切换器样式 */
    .theme-switcher {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      transition: all 0.3s ease;
    }
    
    .theme-switcher:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0,0,0,0.3);
    }
    
    .theme-switcher label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    
    .theme-switcher select {
      width: 200px;
      padding: 10px 12px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255, 255, 255, 0.95);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .theme-switcher select:hover {
      border-color: rgba(255,255,255,0.6);
      background: white;
    }
    
    .theme-switcher select:focus {
      outline: none;
      border-color: white;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
    }
    
    /* 返回顶部按钮 */
    .back-to-top {
      position: fixed;
      bottom: 100px;
      right: 20px;
      z-index: 999;
      width: 50px;
      height: 50px;
      background: var(--gradient-primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      animation: pulse 2s infinite;
    }

    .back-to-top:hover {
      transform: translateY(-5px) scale(1.1);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    /* 进度条样式 */
    .progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      z-index: 9999;
      transition: width 0.3s ease;
    }
    
    /* 内容区域美化 - Lapis 风格 */
    .markdown-section {
      max-width: 950px;
      padding: 30px 45px 40px;
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--lapis-text);
      text-align: justify;
    }

    /* 标题样式 - Lapis 风格 */
    .markdown-section h1 {
      text-align: center;
      padding-top: 0.9rem;
      margin-bottom: 2.3rem;
      color: var(--lapis-primary);
      font-size: 2rem;
      font-weight: 600;
    }

    .markdown-section h2 {
      padding: 8px 16px;
      border-radius: 4px;
      display: inline-block;
      background: var(--lapis-primary);
      color: var(--lapis-bg);
      margin: 1.5rem 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .markdown-section h2 a {
      color: var(--lapis-bg) !important;
      border-bottom: none !important;
    }

    .markdown-section h3 {
      padding-left: 10px;
      border-left: 4px solid var(--lapis-primary);
      margin: 1em 0;
      font-size: 1.4rem;
      color: var(--lapis-primary);
      font-weight: 600;
    }

    .markdown-section h4 {
      font-size: 1.2rem;
      color: var(--lapis-primary);
      margin: 0.8em 0;
      font-weight: 500;
    }

    .markdown-section h5,
    .markdown-section h6 {
      font-size: 1.1rem;
      color: var(--lapis-primary);
      margin: 0.6em 0;
      font-weight: 400;
    }
    
    /* 代码块样式 - Lapis 风格 */
    .markdown-section pre {
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
      margin: 20px 0;
      background: var(--lapis-block-bg);
      padding: 1.2rem 0.8rem;
    }

    .markdown-section code {
      color: var(--lapis-primary);
      font-size: 94%;
      font-weight: normal;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--lapis-block-bg);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }

    .markdown-section pre code {
      background: transparent;
      padding: 0;
    }

    /* 代码块复制按钮样式 - Lapis 风格 */
    .docsify-copy-code-button {
      background: var(--lapis-primary) !important;
      color: white !important;
      border-radius: 6px !important;
      padding: 8px 12px !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      transition: all 0.3s ease !important;
    }

    .docsify-copy-code-button:hover {
      background: var(--theme-color-dark) !important;
      transform: scale(1.05);
    }

    .docsify-copy-code-button.success {
      background: #428485 !important;
    }
    
    /* 链接样式 - Lapis 风格 */
    .markdown-section a {
      color: var(--lapis-primary);
      font-weight: 500;
      text-decoration: underline solid;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
      transition: all 0.3s;
    }

    .markdown-section a:hover {
      text-decoration-thickness: 2px;
      color: var(--theme-color-dark);
    }
    
    /* 表格样式 - Lapis 风格 */
    .markdown-section table {
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin: 25px 0;
      border-collapse: collapse;
      border-spacing: 0;
      border: 1px solid #d9dfe4;
    }

    .markdown-section table thead {
      background: var(--lapis-primary);
      color: white;
    }

    .markdown-section table thead th {
      font-weight: 600;
      padding: 12px 16px;
      color: white;
      text-align: center;
      border: 1px solid #5b8bc4;
    }

    .markdown-section table tbody tr {
      border-top: 1px solid #ccc;
      transition: all 0.2s ease;
    }

    .markdown-section table tbody tr:hover {
      background: var(--lapis-block-bg);
    }

    .markdown-section table tbody td {
      padding: 10px 16px;
      border: 1px solid #d9dfe4;
      font-size: 1rem;
    }
    
    /* 引用块样式 - Lapis 风格 */
    .markdown-section blockquote {
      border-left: 3px solid var(--lapis-primary);
      background: var(--lapis-block-bg);
      padding: 15px 30px 15px 20px;
      margin: 20px 0;
      border-radius: 0 8px 8px 0;
      font-size: 0.95em;
      color: var(--lapis-text);
    }

    .markdown-section blockquote p {
      margin: 0;
      line-height: 1.8;
    }
    
    /* 提示框样式 - Lapis 风格 */
    .markdown-section .tip,
    .markdown-section .warn,
    .markdown-section .danger {
      padding: 16px 24px 16px 60px;
      border-radius: 8px;
      position: relative;
      margin: 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.3s ease;
      font-size: 1.05em;
    }

    .markdown-section .tip {
      background: #4284850a;
      border-left: 3px solid #428485;
      color: #428485;
    }

    .markdown-section .warn {
      background: #9b80490a;
      border-left: 3px solid #a88652;
      color: #a88652;
    }

    .markdown-section .danger {
      background: #a34f550a;
      border-left: 3px solid #a34f55;
      color: #a34f55;
    }

    /* 统计卡片样式 - Lapis 风格 */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(72, 112, 172, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--lapis-border);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--lapis-primary);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(72, 112, 172, 0.15);
    }

    .stat-card-icon {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
      background: var(--lapis-primary);
      color: white;
    }

    .stat-card-value {
      font-size: 32px;
      font-weight: 600;
      color: var(--lapis-text);
      margin-bottom: 8px;
      font-family: 'Cantarell', sans-serif;
    }

    .stat-card-label {
      font-size: 14px;
      color: var(--lapis-text);
      opacity: 0.8;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card-trend {
      display: inline-flex;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    .stat-card-trend.up {
      background: #4284850a;
      color: #428485;
    }

    .stat-card-trend.down {
      background: #a34f550a;
      color: #a34f55;
    }

    /* 文档卡片网格 - Lapis 风格 */
    .docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .doc-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(72, 112, 172, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--lapis-border);
      text-decoration: none;
      display: block;
    }

    .doc-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(72, 112, 172, 0.15);
      border-color: var(--lapis-primary);
    }

    .doc-card-icon {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 16px;
      background: var(--lapis-primary);
      color: white;
    }

    .doc-card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--lapis-text);
      margin-bottom: 8px;
    }

    .doc-card-desc {
      font-size: 14px;
      color: var(--lapis-text);
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .doc-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--lapis-text);
      opacity: 0.7;
    }

    .doc-card-tag {
      padding: 4px 12px;
      border-radius: 20px;
      background: #527da80a;
      color: #527da8;
      font-weight: 500;
      font-size: 11px;
    }
    
    .markdown-section .tip::before,
    .markdown-section .warn::before,
    .markdown-section .danger::before {
      position: absolute;
      left: 15px;
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      font-size: 18px;
    }
    
    .markdown-section .tip {
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
    }
    
    .markdown-section .tip::before {
      content: "\f058";
      color: #4caf50;
    }
    
    .markdown-section .warn {
      background: #fff3e0;
      border-left: 4px solid #ff9800;
    }
    
    .markdown-section .warn::before {
      content: "\f071";
      color: #ff9800;
    }
    
    .markdown-section .danger {
      background: #ffebee;
      border-left: 4px solid #f44336;
    }
    
    .markdown-section .danger::before {
      content: "\f06a";
      color: #f44336;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  
  <!-- 阅读进度条 -->
  <div class="progress" id="progress"></div>
  
  <!-- 返回顶部按钮 -->
  <div class="back-to-top" id="backToTop" onclick="scrollToTop()">
    <i class="fas fa-arrow-up"></i>
  </div>
  
  <!-- 主题切换器 -->
  <div class="theme-switcher">
    <label for="themeSelector"><i class="fas fa-palette"></i> 选择主题</label>
    <select id="themeSelector" onchange="switchTheme(this.value)">
      <optgroup label="🎨 官方主题">
        <option value="vue">Vue - 绿色清新</option>
        <option value="buble">Buble - 紫色优雅</option>
        <option value="dark">Dark - 暗色护眼</option>
        <option value="pure">Pure - 极简纯净</option>
        <option value="dolphin">Dolphin - 蓝色海洋</option>
      </optgroup>
      <optgroup label="✨ 高级主题">
        <option value="simple">Simple - 现代简约</option>
        <option value="simple-dark">Simple Dark - 暗黑模式</option>
        <option value="defaults">Defaults - 经典风格</option>
      </optgroup>
    </select>
    <div id="lastUpdate" style="margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.85); text-align: center;">
      <i class="fas fa-clock"></i> <span id="updateTime"></span>
    </div>
  </div>
  
  <script>
    // 主题配置
    const themes = {
      // 官方主题
      'vue': '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css',
      'buble': '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/buble.css',
      'dark': '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css',
      'pure': '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/pure.css',
      'dolphin': '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dolphin.css',
      // Themeable 主题
      'simple': '//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css',
      'simple-dark': '//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css',
      'defaults': '//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-defaults.css'
    };
    
    // 主题切换功能
    function switchTheme(themeName) {
      const link = document.getElementById('docsify-theme');
      if (link && themes[themeName]) {
        link.href = themes[themeName];
        localStorage.setItem('selectedTheme', themeName);
        
        // 添加切换动画
        document.body.style.opacity = '0';
        setTimeout(() => {
          document.body.style.transition = 'opacity 0.3s';
          document.body.style.opacity = '1';
        }, 50);
      }
    }
    
    // 返回顶部功能
    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }
    
    // 阅读进度条
    function updateProgress() {
      const progress = document.getElementById('progress');
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrolled = window.scrollY;
      const percentage = (scrolled / scrollHeight) * 100;
      progress.style.width = percentage + '%';
      
      // 显示/隐藏返回顶部按钮
      const backToTop = document.getElementById('backToTop');
      if (scrolled > 300) {
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }
    }
    
    // 加载保存的主题
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('selectedTheme') || 'simple';
      const selector = document.getElementById('themeSelector');
      if (selector) {
        selector.value = savedTheme;
        switchTheme(savedTheme);
      }

      // 监听滚动事件
      window.addEventListener('scroll', updateProgress);
      updateProgress();

      // 显示最后更新时间
      const lastUpdate = localStorage.getItem('lastVisit');
      const updateTimeSpan = document.getElementById('updateTime');
      if (updateTimeSpan) {
        if (lastUpdate) {
          const lastDate = new Date(lastUpdate);
          const now = new Date();
          const diffMs = now - lastDate;
          const diffMins = Math.floor(diffMs / 60000);
          const diffHours = Math.floor(diffMs / 3600000);
          const diffDays = Math.floor(diffMs / 86400000);

          let timeText = '';
          if (diffMins < 1) {
            timeText = '刚刚访问';
          } else if (diffMins < 60) {
            timeText = `${diffMins} 分钟前访问`;
          } else if (diffHours < 24) {
            timeText = `${diffHours} 小时前访问`;
          } else {
            timeText = `${diffDays} 天前访问`;
          }
          updateTimeSpan.textContent = timeText;
        } else {
          updateTimeSpan.textContent = '首次访问';
        }
      }

      // 保存本次访问时间
      localStorage.setItem('lastVisit', new Date().toISOString());
    });
  </script>
  
  <script>
    window.$docsify = {
      name: '<i class="fas fa-book"></i> gliderRecord',
      repo: 'glider110/gliderRecord',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',

      // HTML 渲染配置
      markdown: {
        smartypants: true,
        renderer: {
          code: function(code, lang) {
            if (lang === 'pdf') {
              return `<div class="pdf-viewer-container">
                <iframe src="${code.trim()}" width="100%" height="1000px" frameborder="0"></iframe>
              </div>`;
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },

      // 允许 HTML 标签渲染
      html: true,
      
      // 封面页配置
      coverpage: true,
      coverpage: ['/', '/_coverpage.md'],
      
      // Logo
      logo: '',
      
      // Themeable 配置
      themeable: {
        readyTransition: true,
        responsiveTables: true
      },
      
      // 搜索配置
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 搜索文档',
        noData: '😕 未找到结果',
        depth: 6,
        hideOtherSidebarContent: false
      },
      
      // 代码复制配置
      copyCode: {
