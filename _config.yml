# Jekyll 配置 - 简化版本
title: Glider Record
description: 个人工作生活文档记录
author: Glider
email: your-email@example.com
url: "https://glider110.github.io"
baseurl: "/gliderRecord"

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# URL配置
permalink: pretty

# 排除不需要的文件
exclude:
  - README.md
  - package.json
  - fix-assets.js
  - fix-image-paths.js
  - build-specific.sh
  - check-summary-files.js
  - test-urls.js
  - node_modules
  - deploy.sh
  - 部署说明.md
  - Gemfile
  - book.json
  - deploy.md
  - SUMMARY.md
  - README.assets
  - temp_backup
  - "**/temp_backup/**"
  - "**/node_modules/**"
  - "**/.git/**"

# Markdown 设置
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 构建优化
incremental: true
limit_posts: 50