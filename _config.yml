# Jekyll 配置
title: Glider Record
description: 个人工作生活文档记录
author: Glider
email: your-email@example.com
url: "https://glider110.github.io"
baseurl: "/gliderRecord"

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# 排除文件 - 减少构建时间
exclude:
  - README.md
  - package.json
  - fix-assets.js
  - node_modules
  - deploy.sh
  - 部署说明.md
  - Gemfile
  - book.json
  - deploy.md
  - SUMMARY.md
  - README.assets
  - temp_backup
  - "*.assets"
  - "**/*.assets"

# 包含文件 - 只处理必要的文件
include:
  - "*.md"
  - "*.html"
  - "*.css"
  - "*.js"

# Markdown 设置
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 构建优化
incremental: true
limit_posts: 50