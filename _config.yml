# Jekyll 配置 - 基于SUMMARY.md的精确构建
title: Glider Record
description: 个人工作生活文档记录
author: Glider
email: your-email@example.com
url: "https://glider110.github.io"
baseurl: "/gliderRecord"

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# 只包含SUMMARY.md中指定的文件
include:
  # 首页和布局
  - "index.md"
  - "*.html"
  - "*.css"
  - "*.js"
  
  # 工作记录 - 根据SUMMARY.md
  - "record/standard_record/std_record.md"
  - "record/standard_record/develop_record.md"
  - "record/standard_record/on_site_issuse.md"
  - "record/standard_record/meeting.md"
  - "record/standard_record/rack_filter.md"
  - "record/standard_record/test_oba_avoid_2.0.md"
  - "record/standard_record/avoid_obstacle_3.0.md"
  - "record/standard_record/2D_lidar_install.md"
  - "record/standard_record/RobotDockingRelated_report.md"
  - "record/akb_Record/linux.md"
  - "record/akb_Record/cartographer.md"
  - "record/akb_Record/git.md"
  
  # 知识库 - 根据SUMMARY.md
  - "repository/book.md"
  - "repository/book_note.md"
  - "repository/github.md"
  - "repository/mooc_pointclouds.md"
  - "repository/sensor_dev.md"
  - "repository/resume.md"
  - "repository/test.md"  # avoid_demo
  
  # 工具库 - 根据SUMMARY.md
  - "repository/toolkit.md"
  - "repository/isaac-sim-.md"
  - "repository/visualize.md"
  
  # 对应的资源文件
  - "record/**/*.assets/**"
  - "repository/**/*.assets/**"
  - "life_management/**/*.assets/**"
  
  # 图片和媒体文件
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.webp"
  - "*.pdf"

# 排除所有其他文件
exclude:
  - README.md
  - package.json
  - fix-assets.js
  - fix-image-paths.js
  - build-specific.sh
  - node_modules
  - deploy.sh
  - 部署说明.md
  - Gemfile
  - book.json
  - deploy.md
  - SUMMARY.md
  - README.assets
  - temp_backup
  - "**/temp_backup/**"
  - "**/node_modules/**"
  - "**/.git/**"
  # 排除未在SUMMARY.md中列出的文件
  - "record/sliver_record/**"
  - "record/standard_record/*.md"
  - "record/standard_record/*.assets"
  - "record/akb_Record/*.md"
  - "record/akb_Record/*.assets"
  - "repository/*.md"
  - "repository/*.assets"
  - "life_management/**"

# Markdown 设置
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 构建优化
incremental: true
limit_posts: 50