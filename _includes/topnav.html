{% assign nav = site.data.navigation %}
<header class="topnav">
  <div class="brand"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></div>
  <nav class="menu">
    <ul>
      {% for section in nav %}
        <li class="menu-item"><a href="#{{ section.title | slugify: 'pretty' }}">{{ section.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
